set -g clock-mode-colour '#4DAAFC'
set -g copy-mode-current-match-style 'fg=#050505,bg=#DCDCAA'
set -g copy-mode-match-style 'fg=#EEFFFF,bg=#9E6A03'
set -g message-command-style 'fg=#DCDCAA,bg=#1F1F1F'
set -g message-style 'fg=#EEFFFF,bg=#1F1F1F'
set -g mode-style 'fg=#EEFFFF,bg=#264778,bold'
set -g pane-active-border-style 'fg=#0078D4'
set -g pane-border-status off
set -g pane-border-style 'fg=#2B2B2B'
set -g popup-border-style 'fg=#2B2B2B,bg=#1F1F1F'
set -g popup-style 'fg=#CCCCCC,bg=#1F1F1F'
set -g status-left '#[fg=#EEFFFF,bg=#0078D4,bold] #S #[default]'
set -g status-left-style 'fg=#EEFFFF,bg=#0078D4,bold'
set -g status-right '#[fg=#6E7681]#{?client_prefix,PREFIX ,}#[fg=#9D9D9D]%Y-%m-%d #[fg=#CCCCCC]%H:%M '
set -g status-right-style 'fg=#9D9D9D,bg=#101010'
set -g status-style 'fg=#CCCCCC,bg=#101010'
set -g window-status-activity-style 'fg=#DCDCAA,bg=#101010,bold'
set -g window-status-bell-style 'fg=#F85149,bg=#101010,bold'
set -g window-status-current-format ' #I:#W#F '
set -g window-status-current-style 'fg=#EEFFFF,bg=#1F1F1F,bold'
set -g window-status-format ' #I:#W#F '
set -g window-status-style 'fg=#9D9D9D,bg=#101010'
